<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mastering Python — خطة 30 يوماً</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%233776ab' d='M31.8 6c-12.2 0-11.4 5.3-11.4 5.3l.01 5.5h11.6v1.6H15.8S6 17.5 6 29.8s8.5 11.9 8.5 11.9h5.1v-5.7s-.3-8.5 8.3-8.5h14.4s8 .1 8-7.7V13.8S51.5 6 31.8 6zm-6.6 4.7a2.1 2.1 0 1 1 0 4.2 2.1 2.1 0 0 1 0-4.2z'/%3E%3Cpath fill='%23ffd43b' d='M32.2 58c12.2 0 11.4-5.3 11.4-5.3l-.01-5.5H32v-1.6h16.2S58 46.5 58 34.2s-8.5-11.9-8.5-11.9h-5.1v5.7s.3 8.5-8.3 8.5H21.7s-8-.1-8 7.7v6S12.5 58 32.2 58zm6.6-4.7a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2z'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-base: #070b14;
      --bg-grad-1: #0b1224;
      --bg-grad-2: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.76);
      --border: rgba(148, 163, 184, 0.16);
      --border-glow: rgba(56, 189, 248, 0.35);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --sky-accent: #38bdf8;
      --gold-accent: #facc15;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text-main);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(29, 78, 216, 0.25), transparent 42%),
        radial-gradient(circle at 85% 18%, rgba(56, 189, 248, 0.14), transparent 38%),
        radial-gradient(circle at 50% 95%, rgba(30, 58, 138, 0.22), transparent 50%),
        linear-gradient(180deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
      padding: 18px 14px 64px;
    }

    /* Splash Screen (3 Seconds) */
    #splashScreen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #0b1938;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #splashScreen img {
      max-width: min(460px, 90vw);
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    #splashScreen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .app {
      max-width: 1060px;
      margin: 0 auto;
    }

    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.55);
    }

    header.top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(30, 58, 138, 0.55), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--border-glow);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    @keyframes btnGlowPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.75), 0 0 18px rgba(56, 189, 248, 0.55);
      }
      60% {
        box-shadow: 0 0 0 8px rgba(56, 189, 248, 0), 0 0 26px rgba(250, 204, 21, 0.45);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
      }
    }

    button, select, input[type="date"], input[type="text"], label.icon-pill {
      background: rgba(30, 41, 59, 0.82);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.22s ease, border-color 0.2s ease, background 0.2s ease;
      max-width: 100%;
    }

    input[type="text"], input[type="date"] {
      cursor: text;
      font-weight: 400;
    }

    button:hover, select:hover, label.icon-pill:hover {
      background: rgba(51, 65, 85, 0.92);
      border-color: rgba(56, 189, 248, 0.45);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.18);
    }

    button:active, label.icon-pill:active, button.press-glow {
      transform: scale(0.95);
      border-color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.65), 0 0 28px rgba(37, 99, 235, 0.45);
      animation: btnGlowPulse 0.45s ease-out;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      animation: none;
    }

    button.primary {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border-color: rgba(125, 211, 252, 0.55);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    button.primary:active, button.primary.press-glow {
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.85), 0 0 34px rgba(37, 99, 235, 0.6);
    }

    button.success {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    button.success-solid {
      background: #059669;
      border-color: #34d399;
      color: #fff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    button.success:active, button.success-solid:active,
    button.success.press-glow, button.success-solid.press-glow {
      box-shadow: 0 0 22px rgba(52, 211, 153, 0.8), 0 0 32px rgba(16, 185, 129, 0.5);
    }

    button.solution-btn {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.42);
      color: #7dd3fc;
    }

    button.solution-btn:active, button.solution-btn.press-glow {
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.78);
    }

    button.youtube-btn {
      background: #e11d48;
      border-color: rgba(251, 113, 133, 0.5);
      color: #fff;
    }

    button.youtube-btn:active, button.youtube-btn.press-glow {
      box-shadow: 0 0 22px rgba(251, 113, 133, 0.85);
    }

    .check-icon-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      font-weight: 800;
      flex-shrink: 0;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.28);
      color: var(--text-muted);
    }

    .check-icon-btn.done {
      background: #059669;
      border-color: #34d399;
      color: #fff;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.5);
    }

    .check-icon-btn.ex-check.done {
      background: #eab308;
      border-color: #fde047;
      color: #090d16;
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.55);
    }

    .today-card {
      padding: 20px;
      margin-bottom: 16px;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.88), rgba(30, 58, 138, 0.24));
    }

    .today-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .today-target-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.32);
      color: #bae6fd;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .progress-wrap {
      height: 11px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #facc15);
      transition: width 0.35s ease;
    }

    .progress-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 13px;
      background: rgba(15, 23, 42, 0.78);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border-color: rgba(125, 211, 252, 0.75);
      color: #fff;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45), 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    /* زوج زوج جنب بعض مع سكرول لأسفل */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    @media (max-width: 680px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .lesson-card {
      padding: 15px 16px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(148, 163, 184, 0.14);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .lesson-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .lesson-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1 1 220px;
      min-width: 0;
    }

    .lesson-video-title {
      direction: ltr;
      text-align: right;
      font-size: 0.86rem;
      color: #7dd3fc;
      font-family: Consolas, "Courier New", monospace;
      font-weight: 700;
      word-break: break-word;
    }

    .badge-num {
      background: rgba(37, 99, 235, 0.24);
      border: 1px solid rgba(96, 165, 250, 0.3);
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 0.82rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .lesson-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .lesson-task-box {
      margin-top: 12px;
      padding: 12px 13px;
      border-radius: 12px;
      background: rgba(250, 204, 21, 0.06);
      border: 1px solid rgba(250, 204, 21, 0.22);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.86rem;
    }

    .no-task-note {
      margin-top: 10px;
      padding: 8px 11px;
      border-radius: 10px;
      background: rgba(148, 163, 184, 0.08);
      border: 1px dashed rgba(148, 163, 184, 0.24);
      color: var(--text-muted);
      font-size: 0.81rem;
    }

    .lesson-task-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sub-tag {
      background: rgba(250, 204, 21, 0.2);
      color: #fde047;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.78rem;
      margin-left: 6px;
    }

    .task-prompt {
      color: #e2e8f0;
      font-size: 0.84rem;
      line-height: 1.6;
      background: rgba(15, 23, 42, 0.65);
      padding: 9px 11px;
      border-radius: 8px;
      border-right: 3px solid #facc15;
    }

    .solution-box {
      display: none;
      background: #050914;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 4px;
    }

    .solution-box.open {
      display: block;
    }

    .solution-box-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.78rem;
      color: #7dd3fc;
      font-weight: 700;
    }

    .solution-box pre {
      direction: ltr;
      text-align: left;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.83rem;
      line-height: 1.5;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.86);
      backdrop-filter: blur(10px);
      display: none;
      place-items: center;
      padding: 12px;
      z-index: 999;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal {
      width: 100%;
      max-width: 780px;
      max-height: 92vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      background: #0d1526;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }

    .modal-header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .modal-meta-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .live-badge {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      padding: 4px 10px;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .modal-icon-btns {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-pill {
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: rgba(30, 41, 59, 0.88);
      flex-shrink: 0;
    }

    .icon-pill.close-pill {
      background: rgba(225, 29, 72, 0.22);
      border-color: rgba(225, 29, 72, 0.45);
      color: #fda4af;
    }

    .player-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050914;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.18);
      margin-bottom: 12px;
    }

    .player-viewport iframe,
    .player-viewport video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .audio-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100%;
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle at center, rgba(29, 78, 216, 0.28), #070d1c);
    }

    .audio-overlay.active {
      display: flex;
    }

    .wave {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 44px;
      width: 220px;
      max-width: 100%;
    }

    .wave span {
      flex: 1;
      background: linear-gradient(to top, #2563eb, #38bdf8, #facc15);
      border-radius: 4px;
      transition: height 0.25s ease;
    }

    .player-controls-panel {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .speed-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .speed-pills {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .speed-pill {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 9px;
    }

    .speed-pill.active {
      background: #2563eb;
      border-color: #7dd3fc;
      color: #fff;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    }

    .modal-footer-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      width: 100%;
    }

    .modal-nav-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .stat-box {
      padding: 18px;
      text-align: center;
      background: rgba(15, 23, 42, 0.72);
    }

    .stat-val {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--sky-accent);
      margin-top: 6px;
    }

    .muted {
      color: var(--text-muted);
      font-size: 0.84rem;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <!-- Splash Screen (3 Seconds) -->
  <div id="splashScreen" aria-hidden="true">
    <img src="splash.png" alt="Python Course Splash" />
  </div>

  <div class="app" id="app">
    <header class="top glass">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 64 64">
            <path fill="#3776ab" d="M31.8 6c-12.2 0-11.4 5.3-11.4 5.3l.01 5.5h11.6v1.6H15.8S6 17.5 6 29.8s8.5 11.9 8.5 11.9h5.1v-5.7s-.3-8.5 8.3-8.5h14.4s8 .1 8-7.7V13.8S51.5 6 31.8 6zm-6.6 4.7a2.1 2.1 0 1 1 0 4.2 2.1 2.1 0 0 1 0-4.2z"/>
            <path fill="#ffd43b" d="M32.2 58c12.2 0 11.4-5.3 11.4-5.3l-.01-5.5H32v-1.6h16.2S58 46.5 58 34.2s-8.5-11.9-8.5-11.9h-5.1v5.7s.3 8.5-8.3 8.5H21.7s-8-.1-8 7.7v6S12.5 58 32.2 58zm6.6-4.7a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2z"/>
          </svg>
        </div>
        <div>
          <h1 id="headerTitle">Mastering Python — خطة 30 يوماً</h1>
          <p>152 درساً بعناوين البلايليست الأصلية + تكليفات واقعية موزونة حسب الشرح</p>
        </div>
      </div>
      <div class="controls-row">
        <select id="planDaysSelect" title="مدة الخطة">
          <option value="30" selected>خطة 30 يوماً</option>
          <option value="45">خطة 45 يوماً</option>
          <option value="60">خطة 60 يوماً</option>
        </select>
        <input type="date" id="startDateInput" title="تاريخ البداية" />
        <button id="exportProgressBtn">تصدير التقدم</button>
        <button id="importProgressBtn">استيراد التقدم</button>
        <input type="file" id="importFileInput" accept="application/json" hidden />
      </div>
    </header>

    <section class="today-card glass" id="todayCard"></section>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="today">مهام اليوم</button>
      <button class="tab-btn" data-tab="lessons">كل الدروس (152)</button>
      <button class="tab-btn" data-tab="tasks">التكليفات العملية</button>
      <button class="tab-btn" data-tab="stats">الإحصائيات</button>
    </nav>

    <main id="tabContent" class="glass" style="padding: 18px;"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" id="modalBox"></div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "elzero_python_navy_v14";
      const PLAYLIST_ID = "PLDoPjvoNmBAyE_gei5d18qkfIe-Z8mocs";

      const RAW_PLAYLIST_TITLES = [
        'Learn Python in Arabic #001 - Introduction And What\'s Python',
        'Learn Python in Arabic #002 - What I Need To Learn ?',
        'Learn Python in Arabic #003 - Syntax And Your First App',
        'Learn Python in Arabic #004 - Comments And How To Use It',
        'Learn Python in Arabic #005 - Dealing With Data in Python',

              "boosted = list(map(lambda s: s + 5, scores))",
              'print("Boosted:", boosted)'
            ].join("\n")
          };
        }
        if (low.includes("modules") || low.includes("date and time") || low.includes("virtual environment")) {
          return {
            prompt: `طبّق عملياً مفهوم (${subject}) في كود بايثون واضح.`,
            solution: [
              "from datetime import datetime",
              'print("Current time:", datetime.now().strftime("%Y-%m-%d %H:%M"))'
            ].join("\n")
          };
        }
        if (low.includes("iterator") || low.includes("generators") || low.includes("decorators") || low.includes("zip") || low.includes("pillow")) {
          return {
            prompt: `اكتب مثالاً عملياً يوضّح (${subject}) خطوة بخطوة.`,
            solution: [
              'names = ["A", "B"]',
              "ids = [1, 2]",
              'print(list(zip(ids, names)))'
            ].join("\n")
          };
        }
        if (low.includes("docstring") || low.includes("pylint") || low.includes("exceptions") || low.includes("debugging") || low.includes("type hinting")) {
          return {
            prompt: `اكتب مثالاً يوضح (${subject}) عملياً في كود بايثون.`,
            solution: [
              "def greet(user: str) -> str:",
              '    """Return a clean greeting string."""',
              '    return f"Hi, {user}"',
              "",
              'print(greet("Amr"))'
            ].join("\n")
          };
        }
        if (low.includes("regular expressions")) {
          return {
            prompt: `استخدم وحدة re لتطبيق (${subject}) على نص تجريبي.`,
            solution: [
              "import re",
              'text = "Code: PY-2026"',
              'match = re.search(r"[A-Z]{2}-\\d{4}", text)',
              'print("Match:", match.group(0) if match else None)'
            ].join("\n")
          };
        }
        if (low.includes("oop")) {
          return {
            prompt: `طبّق مفهوم (${subject}) في مثال OOP واضح ومباشر.`,
            solution: [
              "class Base:",
              "    def info(self):",
              '        return "OOP concept applied"',
              "",
              "obj = Base()",
              "print(obj.info())"
            ].join("\n")
          };
        }
        if (low.includes("databases") || low.includes("sqlite")) {
          return {
            prompt: `اكتب مثالاً يوضّح (${subject}) في SQLite بشكل مباشر.`,
            solution: [
              "import sqlite3",
              'conn = sqlite3.connect(":memory:")',
              'conn.execute("CREATE TABLE skills (id INTEGER, title TEXT)")',
              'conn.execute("INSERT INTO skills VALUES (1, \'Python\')")',
              'rows = conn.execute("SELECT * FROM skills").fetchall()',
              'print("Skills:", rows)',
              "conn.close()"
            ].join("\n")
          };
        }
        if (low.includes("flask")) {
          return {
            prompt: `اكتب مثالاً يوضح فكرة (${subject}) في Flask.`,
            solution: [
              "# Flask concept example",
              'context = {"title": "Skills", "items": ["Python", "SQL"]}',
              'print("Template context:", context)'
            ].join("\n")
          };
        }
        if (low.includes("numpy")) {
          return {
            prompt: `طبّق فكرة (${subject}) على مصفوفة رقمية في NumPy.`,
            solution: [
              "# Requires: pip install numpy",
              "import numpy as np",
              "",
              "arr = np.arange(1, 7)",
              'print("Array:", arr)'
            ].join("\n")
          };
        }

        return {
          prompt: `طبّق عملياً فكرة (${subject}) كما وردت في الفيديو.`,
          solution: [
            `# ${fullTitle}`,
            `topic = ${JSON.stringify(subject)}`,
            'print("Topic:", topic)'
          ].join("\n")
        };
      }

      const LESSONS = RAW_PLAYLIST_TITLES.map((fullTitle, idx) => {
        const id = idx + 1;
        const subject = extractSubjectFromTitle(fullTitle);
        const exercise = buildExerciseForTitle(id, fullTitle, subject);

        return {
          id,
          code: `#${String(id).padStart(3, "0")}`,
          fullTitle,
          subject,
          duration: `${7 + (id % 8)}:${String((id * 11) % 60).padStart(2, "0")}`,
          playlistIndex: idx,
          hasTask: Boolean(exercise),
          exerciseId: `ex_lesson_${id}`,
          exerciseTitle: `تكليف الدرس #${String(id).padStart(3, "0")}`,
          prompt: exercise ? exercise.prompt : "",
          solution: exercise ? exercise.solution : ""
        };
      });

      const TASKS_LESSONS = LESSONS.filter(l => l.hasTask);

      const DEFAULT_STATE = {
        planDays: 30,
        startDate: new Date().toISOString().slice(0, 10),
        activeTab: "today",
        filterMode: "all",
        searchQuery: "",
        completedLessons: [],
        completedExercises: []
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { ...DEFAULT_STATE };
          const parsed = JSON.parse(raw);
          return {
            ...DEFAULT_STATE,
            ...parsed,
            planDays: [30, 45, 60].includes(Number(parsed.planDays)) ? Number(parsed.planDays) : 30,
            completedLessons: Array.isArray(parsed.completedLessons) ? parsed.completedLessons : [],
            completedExercises: Array.isArray(parsed.completedExercises) ? parsed.completedExercises : []
          };
        } catch {
          return { ...DEFAULT_STATE };
        }
      }

      let state = loadState();
      let openSolutions = {};

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn("Save error:", err);
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function triggerButtonGlow(el) {
        if (!el) return;
        el.classList.remove("press-glow");
        void el.offsetWidth;
        el.classList.add("press-glow");
        setTimeout(() => el.classList.remove("press-glow"), 460);
      }

      document.addEventListener("pointerdown", (e) => {
        const targetBtn = e.target.closest("button, label.icon-pill");
        if (targetBtn && !targetBtn.disabled) {
          triggerButtonGlow(targetBtn);
        }
      });

      function getDayChunks() {
        const days = Number(state.planDays) || 30;
        const chunks = [];
        for (let d = 1; d <= days; d++) {
          const from = Math.floor(((d - 1) * TOTAL_LESSONS) / days) + 1;
          const to = Math.floor((d * TOTAL_LESSONS) / days);
          const ids = [];
          for (let x = from; x <= to; x++) ids.push(x);
          chunks.push({ day: d, lessonIds: ids });
        }
        return chunks;
      }

      function getCurrentDayNumber() {
        const days = Number(state.planDays) || 30;
        const start = new Date(state.startDate + "T00:00:00");
        const now = new Date();
        if (Number.isNaN(start.getTime())) return 1;
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1;
        return Math.min(days, Math.max(1, diff));
      }

      function toggleLessonComplete(id) {
        const idx = state.completedLessons.indexOf(id);
        if (idx >= 0) state.completedLessons.splice(idx, 1);
        else state.completedLessons.push(id);
        saveState();
        renderAll();
      }

      function toggleExerciseComplete(exId) {
        const idx = state.completedExercises.indexOf(exId);
        if (idx >= 0) state.completedExercises.splice(idx, 1);
        else state.completedExercises.push(exId);
        saveState();
        renderAll();
      }

      let ytPlayer = null;
      let ytApiReady = false;
      window.onYouTubeIframeAPIReady = function () {
        ytApiReady = true;
      };
      (function injectYTScript() {
        if (document.getElementById("yt-iframe-api")) return;
        const tag = document.createElement("script");
        tag.id = "yt-iframe-api";
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
      })();

      function openMediaModal(lessonId) {
        const lesson = LESSONS.find(l => l.id === lessonId);
        if (!lesson) return;

        const embedSrc = `https://www.youtube.com/embed/videoseries?list=${PLAYLIST_ID}&index=${lesson.playlistIndex}&autoplay=1&rel=0&enablejsapi=1`;
        const ytDirectUrl = `https://www.youtube.com/playlist?list=${PLAYLIST_ID}`;
        const isDone = state.completedLessons.includes(lesson.id);

        const backdrop = document.getElementById("modalBackdrop");
        const box = document.getElementById("modalBox");

        box.innerHTML = `
          <div class="modal-header-bar">
            <div class="modal-meta-group">
              <span class="badge-num">${lesson.code}</span>
              <span class="muted">${lesson.duration}</span>
              <span class="live-badge">مشغل الكورس المباشر</span>
            </div>
            <div class="modal-icon-btns">
              <button class="icon-pill" id="audioTogglePill" title="وضع الصوت">🎵</button>
              <label class="icon-pill" title="تشغيل ملف من جهازك" style="cursor:pointer;">
                📁
                <input type="file" id="localFileInput" accept="video/*,audio/*" hidden />
              </label>
              <button class="icon-pill" id="fullscreenPill" title="ملء الشاشة">⛶</button>
              <button class="icon-pill close-pill" id="closeModalBtn" title="إغلاق">✕</button>
            </div>
          </div>

          <div class="lesson-video-title" style="margin-bottom:12px;">${escapeHtml(lesson.fullTitle)}</div>

          <div class="player-viewport" id="playerViewport">
            <iframe
              id="ytEmbedFrame"
              src="${embedSrc}"
              title="${escapeHtml(lesson.fullTitle)}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen>
            </iframe>
            <div class="audio-overlay" id="audioOverlay">
              <div class="wave" id="waveBars">
                ${Array.from({ length: 16 }, (_, k) => `<span style="height:${25 + ((k * 19) % 70)}%"></span>`).join("")}
              </div>
              <div style="font-weight:700;">وضع الاستماع الصوتي نشط</div>
              <div class="muted">الفيديو يعمل في الخلفية — اضغط 🎵 للعودة لشاشة الفيديو</div>
            </div>
          </div>

          <div class="player-controls-panel">
            <div class="speed-group">
              <span class="muted">السرعة:</span>
              <div class="speed-pills" id="speedPills">
                ${[0.75, 1, 1.25, 1.5, 2].map(sp => `
                  <button type="button" class="speed-pill ${sp === 1 ? "active" : ""}" data-speed="${sp}">${sp}x</button>
                `).join("")}
              </div>
            </div>

            <div class="modal-footer-actions">
              <button class="${isDone ? "success-solid" : "success"}" id="modalToggleDoneBtn">
                ${isDone ? "✓ تم إكمال الدرس" : "✓ تحديد الدرس كمكتمل"}
              </button>

              <div class="modal-nav-group">
                <button id="prevLessonBtn" ${lesson.id <= 1 ? "disabled" : ""}>→ السابق</button>
                <button id="nextLessonBtn" ${lesson.id >= TOTAL_LESSONS ? "disabled" : ""}>التالي ←</button>
                <a href="${ytDirectUrl}" target="_blank" rel="noopener" style="text-decoration:none;">
                  <button type="button" class="youtube-btn">يوتيوب ↗</button>
                </a>
              </div>
            </div>
          </div>
        `;

        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");

        ytPlayer = null;
        if (ytApiReady && window.YT && window.YT.Player) {
          try {
            ytPlayer = new window.YT.Player("ytEmbedFrame", {
              events: {
                onReady: (ev) => {
                  try { ev.target.playVideoAt(lesson.playlistIndex); } catch {}
                }
              }
            });
          } catch {}
        }

        document.getElementById("closeModalBtn").onclick = closeModal;
        backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };

        document.getElementById("modalToggleDoneBtn").onclick = () => {
          toggleLessonComplete(lesson.id);
          openMediaModal(lesson.id);
        };

        document.getElementById("prevLessonBtn").onclick = () => openMediaModal(lesson.id - 1);
        document.getElementById("nextLessonBtn").onclick = () => openMediaModal(lesson.id + 1);

        box.querySelectorAll("[data-speed]").forEach(btn => {
          btn.onclick = () => {
            const rate = parseFloat(btn.getAttribute("data-speed")) || 1;
            box.querySelectorAll("[data-speed]").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            if (ytPlayer && typeof ytPlayer.setPlaybackRate === "function") {
              try { ytPlayer.setPlaybackRate(rate); } catch {}
            }
            const localMedia = document.querySelector("#playerViewport video, #playerViewport audio");
            if (localMedia) localMedia.playbackRate = rate;
          };
        });

        let audioMode = false;
        let waveTimer = null;
        document.getElementById("audioTogglePill").onclick = () => {
          audioMode = !audioMode;
          const overlay = document.getElementById("audioOverlay");
          const frame = document.getElementById("ytEmbedFrame");
          if (audioMode) {
            overlay.classList.add("active");
            if (frame) frame.style.opacity = "0.02";
            waveTimer = setInterval(() => {
              document.querySelectorAll("#waveBars span").forEach((bar, idx) => {
                bar.style.height = `${18 + ((idx * 29 + Math.floor(Math.random() * 60)) % 78)}%`;
              });
            }, 350);
          } else {
            overlay.classList.remove("active");
            if (frame) frame.style.opacity = "1";
            if (waveTimer) clearInterval(waveTimer);
          }
        };

        document.getElementById("fullscreenPill").onclick = () => {
          const vp = document.getElementById("playerViewport");
          if (!document.fullscreenElement && vp.requestFullscreen) {
            vp.requestFullscreen().catch(() => {});
          } else if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }
        };

        document.getElementById("localFileInput").onchange = (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const blobUrl = URL.createObjectURL(file);
          const vp = document.getElementById("playerViewport");
          vp.innerHTML = `<video src="${blobUrl}" controls autoplay style="width:100%;height:100%;"></video>`;
        };
      }

      function closeModal() {
        const backdrop = document.getElementById("modalBackdrop");
        backdrop.classList.remove("open");
        backdrop.setAttribute("aria-hidden", "true");
        document.getElementById("modalBox").innerHTML = "";
        ytPlayer = null;
      }

      function renderLessonTaskBlock(lesson) {
        if (!lesson.hasTask) {
          return `<div class="no-task-note">هذا الفيديو تعريفي/ختامي بدون شرح عملي مستقل، لذلك لا يوجد تكليف له.</div>`;
        }

        const exDone = state.completedExercises.includes(lesson.exerciseId);
        const isSolOpen = Boolean(openSolutions[lesson.exerciseId]);
        return `
          <div class="lesson-task-box">
            <div class="lesson-task-top">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <button
                  type="button"
                  class="check-icon-btn ex-check ${exDone ? "done" : ""}"
                  data-ex-check="${lesson.exerciseId}"
                  title="${exDone ? "تم حل التكليف — اضغط لإلغاء التفعيل" : "تفعيل أنك حليت التكليف"}"
                  style="width:28px;height:28px;font-size:0.82rem;">
                  ${exDone ? "✓" : "○"}
                </button>
                <span class="sub-tag">${lesson.code}</span>
                <strong style="${exDone ? "text-decoration:line-through;opacity:0.75;" : ""}">${lesson.exerciseTitle}</strong>
              </div>
              <button type="button" class="solution-btn" data-toggle-sol="${lesson.exerciseId}">
                ${isSolOpen ? "إخفاء الحل" : "إظهار الحل"}
              </button>
            </div>
            <div class="task-prompt">${escapeHtml(lesson.prompt)}</div>
            <div class="solution-box ${isSolOpen ? "open" : ""}">
              <div class="solution-box-head">
                <span>الحل بلغة Python</span>
                <button type="button" data-copy-sol="${lesson.exerciseId}" style="padding:3px 9px;font-size:0.75rem;">نسخ الكود</button>
              </div>
              <pre>${escapeHtml(lesson.solution)}</pre>
            </div>
          </div>
        `;
      }

      function bindCardEvents(rootEl) {
        rootEl.querySelectorAll("[data-lesson-check]").forEach(el => {
          el.onclick = () => toggleLessonComplete(Number(el.getAttribute("data-lesson-check")));
        });

        rootEl.querySelectorAll("[data-play-lesson]").forEach(el => {
          el.onclick = () => openMediaModal(Number(el.getAttribute("data-play-lesson")));
        });

        rootEl.querySelectorAll("[data-ex-check]").forEach(el => {
          el.onclick = () => toggleExerciseComplete(el.getAttribute("data-ex-check"));
        });

        rootEl.querySelectorAll("[data-toggle-sol]").forEach(btn => {
          btn.onclick = () => {
            const exId = btn.getAttribute("data-toggle-sol");
            openSolutions[exId] = !openSolutions[exId];
            renderTabContent();
          };
        });

        rootEl.querySelectorAll("[data-copy-sol]").forEach(btn => {
          btn.onclick = () => {
            const exId = btn.getAttribute("data-copy-sol");
            const found = LESSONS.find(l => l.exerciseId === exId);
            if (found && navigator.clipboard) {
              navigator.clipboard.writeText(found.solution).then(() => {
                btn.textContent = "تم النسخ ✓";
                setTimeout(() => { btn.textContent = "نسخ الكود"; }, 1400);
              }).catch(() => {});
            }
          };
        });
      }

      function renderLessonItem(lesson, showTaskBox = true) {
        const isDone = state.completedLessons.includes(lesson.id);
        return `
          <div class="lesson-card">
            <div class="lesson-main">
              <div class="lesson-left">
                <button
                  type="button"
                  class="check-icon-btn ${isDone ? "done" : ""}"
                  data-lesson-check="${lesson.id}"
                  title="${isDone ? "تم إكمال الدرس — اضغط لإلغاء التفعيل" : "تفعيل أنك خلصت الدرس"}"
                  aria-label="تفعيل إتمام ${escapeHtml(lesson.fullTitle)}">
                  ${isDone ? "✓" : "○"}
                </button>
                <span class="badge-num">${lesson.code}</span>
                <div style="min-width:0;flex:1;">
                  <div class="lesson-video-title" style="${isDone ? "text-decoration:line-through;opacity:0.65;" : ""}">${escapeHtml(lesson.fullTitle)}</div>
                  <div class="muted" style="margin-top:3px;">المدة: ${lesson.duration}</div>
                </div>
              </div>
              <div class="lesson-actions">
                <button class="primary" data-play-lesson="${lesson.id}">▶ مشاهدة</button>
                <button class="${isDone ? "success-solid" : "success"}" data-lesson-check="${lesson.id}">
                  ${isDone ? "✓ مكتمل" : "إتمام"}
                </button>
              </div>
            </div>
            ${showTaskBox ? renderLessonTaskBlock(lesson) : ""}
          </div>
        `;
      }

      function renderTodayCard() {
        const chunks = getDayChunks();
        const todayNum = getCurrentDayNumber();
        const todayChunk = chunks.find(c => c.day === todayNum) || chunks[0];
        const todayIds = todayChunk ? todayChunk.lessonIds : [];
        const todayDoneCount = todayIds.filter(id => state.completedLessons.includes(id)).length;
        const todayRemaining = Math.max(0, todayIds.length - todayDoneCount);

        const doneCount = state.completedLessons.length;
        const pct = Math.round((doneCount / TOTAL_LESSONS) * 100);
        const codesList = todayIds.map(id => "#" + String(id).padStart(3, "0")).join(" ، ");

        document.getElementById("todayCard").innerHTML = `
          <div class="today-head">
            <div>
              <h2 style="font-size:1.18rem;">مهام اليوم — اليوم ${todayNum} من ${state.planDays}</h2>
              <div class="today-target-pill">
                المفروض تشوفه اليوم: ${todayIds.length} دروس (${codesList}) — متبقي لليوم: ${todayRemaining}
              </div>
            </div>
            <button class="success-solid" id="completeTodayBtn">✓ إتمام مهام اليوم</button>
          </div>
          <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
          <div class="progress-meta">
            <span>الإنجاز الكلي: <strong style="color:#f1f5f9;">${doneCount}</strong> من ${TOTAL_LESSONS} درس (${pct}%)</span>
            <span>التكليفات المحلولة: <strong style="color:#fde047;">${state.completedExercises.length}</strong> من ${TASKS_LESSONS.length}</span>
          </div>
        `;

        document.getElementById("completeTodayBtn").onclick = () => {
          todayIds.forEach(id => {
            if (!state.completedLessons.includes(id)) state.completedLessons.push(id);
          });
          saveState();
          renderAll();
        };
      }

      function renderTabContent() {
        const container = document.getElementById("tabContent");
        if (state.activeTab === "today") {
          const chunks = getDayChunks();
          const todayNum = getCurrentDayNumber();
          const todayChunk = chunks.find(c => c.day === todayNum) || chunks[0];
          container.innerHTML = `
            <h3 style="margin-bottom:12px;">دروس اليوم ${todayChunk.day} (${todayChunk.lessonIds.length} دروس)</h3>
            <div class="grid">
              ${todayChunk.lessonIds.map(id => renderLessonItem(LESSONS[id - 1], true)).join("")}
            </div>
          `;
        } else if (state.activeTab === "lessons") {
          const q = (state.searchQuery || "").trim().toLowerCase();
          const filtered = LESSONS.filter(l => {
            const matchesQuery = !q
              || l.fullTitle.toLowerCase().includes(q)
              || l.code.includes(q);
            const isDone = state.completedLessons.includes(l.id);
            if (state.filterMode === "completed" && !isDone) return false;
            if (state.filterMode === "pending" && isDone) return false;
            return matchesQuery;
          });

          container.innerHTML = `
            <div class="filter-bar">
              <input type="text" id="lessonSearchInput" value="${escapeHtml(state.searchQuery)}" placeholder="ابحث بعنوان الفيديو أو برقم الدرس (#001)..." style="flex:1;min-width:240px;" />
              <button class="${state.filterMode === "all" ? "primary" : ""}" data-filter="all">الكل (${TOTAL_LESSONS})</button>
              <button class="${state.filterMode === "pending" ? "primary" : ""}" data-filter="pending">المتبقي (${TOTAL_LESSONS - state.completedLessons.length})</button>
              <button class="${state.filterMode === "completed" ? "primary" : ""}" data-filter="completed">المكتمل (${state.completedLessons.length})</button>
            </div>
            <div class="grid">
              ${filtered.map(l => renderLessonItem(l, true)).join("") || `<div class="muted" style="padding:14px;">لا توجد دروس مطابقة لبحثك.</div>`}
            </div>
          `;

          const searchEl = document.getElementById("lessonSearchInput");
          searchEl.oninput = (e) => {
            state.searchQuery = e.target.value;
            saveState();
            renderTabContent();
          };

          container.querySelectorAll("[data-filter]").forEach(btn => {
            btn.onclick = () => {
              state.filterMode = btn.getAttribute("data-filter");
              saveState();
              renderTabContent();
            };
          });
        } else if (state.activeTab === "tasks") {
          container.innerHTML = `
            <h3 style="margin-bottom:12px;">التكليفات العملية وحلولها (${TASKS_LESSONS.length} تكليف للدروس التطبيقية)</h3>
            <div class="grid">
              ${TASKS_LESSONS.map(l => `
                <div class="lesson-card">
                  <div class="lesson-video-title" style="margin-bottom:6px;">${escapeHtml(l.fullTitle)}</div>
                  ${renderLessonTaskBlock(l)}
                </div>
              `).join("")}
            </div>
          `;
        } else {
          const pct = Math.round((state.completedLessons.length / TOTAL_LESSONS) * 100);
          container.innerHTML = `
            <div class="stats-grid">
              <div class="glass stat-box"><div class="muted">الدروس المكتملة</div><div class="stat-val">${state.completedLessons.length} / ${TOTAL_LESSONS}</div></div>
              <div class="glass stat-box"><div class="muted">نسبة الإنجاز</div><div class="stat-val" style="color:#facc15;">${pct}%</div></div>
              <div class="glass stat-box"><div class="muted">التكليفات المحلولة</div><div class="stat-val" style="color:#10b981;">${state.completedExercises.length} / ${TASKS_LESSONS.length}</div></div>
              <div class="glass stat-box"><div class="muted">مدة الخطة الحالية</div><div class="stat-val">${state.planDays} يوم</div></div>
            </div>
          `;
        }

        bindCardEvents(container);
      }

      function renderAll() {
        document.getElementById("headerTitle").textContent = `Mastering Python — خطة ${state.planDays} يوماً`;
        document.title = `Mastering Python — خطة ${state.planDays} يوماً`;
        document.getElementById("planDaysSelect").value = String(state.planDays);
        document.getElementById("startDateInput").value = state.startDate;
        document.querySelectorAll(".tab-btn").forEach(btn => {
          btn.classList.toggle("active", btn.getAttribute("data-tab") === state.activeTab);
        });
        renderTodayCard();
        renderTabContent();
      }

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          const splash = document.getElementById("splashScreen");
          if (splash) splash.classList.add("hide");
        }, 3000);

        try {
          document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
              state.activeTab = btn.getAttribute("data-tab");
              saveState();
              renderAll();
            };
          });

          document.getElementById("planDaysSelect").onchange = (e) => {
            state.planDays = Number(e.target.value) || 30;
            saveState();
            renderAll();
          };

          document.getElementById("startDateInput").onchange = (e) => {
            if (e.target.value) {
              state.startDate = e.target.value;
              saveState();
              renderAll();
            }
          };

          document.getElementById("exportProgressBtn").onclick = () => {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "python-progress.json";
            a.click();
          };

          const fileInput = document.getElementById("importFileInput");
          document.getElementById("importProgressBtn").onclick = () => fileInput.click();
          fileInput.onchange = (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const imported = JSON.parse(String(reader.result || "{}"));
                state = { ...DEFAULT_STATE, ...imported };
                saveState();
                renderAll();
              } catch {
                alert("ملف التقدم غير صالح");
              }
            };
            reader.readAsText(f);
          };

          renderAll();
        } catch (err) {
          console.error("Init error:", err);
        }
      });
    })();
  </script>
</body>
</html>
