<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mastering Python — متابعة الكورس (30 يوماً)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%233776ab' d='M31.8 6c-12.2 0-11.4 5.3-11.4 5.3l.01 5.5h11.6v1.6H15.8S6 17.5 6 29.8s8.5 11.9 8.5 11.9h5.1v-5.7s-.3-8.5 8.3-8.5h14.4s8 .1 8-7.7V13.8S51.5 6 31.8 6zm-6.6 4.7a2.1 2.1 0 1 1 0 4.2 2.1 2.1 0 0 1 0-4.2z'/%3E%3Cpath fill='%23ffd43b' d='M32.2 58c12.2 0 11.4-5.3 11.4-5.3l-.01-5.5H32v-1.6h16.2S58 46.5 58 34.2s-8.5-11.9-8.5-11.9h-5.1v5.7s.3 8.5-8.3 8.5H21.7s-8-.1-8 7.7v6S12.5 58 32.2 58zm6.6-4.7a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2z'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg1: #090e1c;
      --bg2: #121b34;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f4f7ff;
      --muted: #a6b4d4;
      --accent: #38bdf8;
      --accent2: #facc15;
      --success: #22c55e;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    body {
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at 14% 12%, rgba(56, 189, 248, 0.22), transparent 40%),
                  radial-gradient(circle at 86% 18%, rgba(250, 204, 21, 0.14), transparent 38%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      padding: 20px 14px 60px;
    }
    .app { max-width: 1120px; margin: 0 auto; }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
    }
    header.top {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 14px; padding: 18px 22px; margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.09); border: 1px solid var(--border);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .brand h1 { font-size: 1.25rem; font-weight: 700; }
    .brand p { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    select, input[type="date"], input[type="text"], button {
      background: var(--glass-strong); color: var(--text);
      border: 1px solid var(--border); border-radius: 11px;
      padding: 8px 12px; font-size: 0.88rem; cursor: pointer; transition: 0.2s ease;
    }
    input[type="text"], input[type="date"] { cursor: text; }
    button:hover, select:hover { background: rgba(255, 255, 255, 0.22); transform: translateY(-1px); }
    button.primary { background: linear-gradient(135deg, #0284c7, #2563eb); border-color: transparent; font-weight: 600; }
    button.success { background: rgba(34, 197, 94, 0.22); border-color: rgba(34, 197, 94, 0.45); color: #bbf7d0; }
    button.warn { background: rgba(250, 204, 21, 0.18); border-color: rgba(250, 204, 21, 0.4); color: #fef08a; }

    .today-card { padding: 20px; margin-bottom: 18px; }
    .today-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .progress-wrap { height: 10px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin: 10px 0 14px; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.35s ease; }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .tab-btn { padding: 10px 16px; border-radius: 12px; font-weight: 600; }
    .tab-btn.active { background: var(--accent); color: #061324; border-color: transparent; }

    .grid { display: grid; gap: 12px; }
    .lesson-card { padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
    .lesson-main { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .lesson-left { display: flex; align-items: center; gap: 10px; }
    .badge-num { background: rgba(56,189,248,0.18); color: #7dd3fc; padding: 4px 9px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; }
    .lesson-actions { display: flex; flex-wrap: wrap; gap: 7px; }

    .sub-ex-list { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.14); display: grid; gap: 8px; }
    .sub-ex-item {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 12px; border-radius: 11px; background: rgba(250, 204, 21, 0.08); border: 1px solid rgba(250, 204, 21, 0.22);
      font-size: 0.86rem;
    }
    .sub-tag { background: rgba(250, 204, 21, 0.22); color: #fde047; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 0.78rem; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(8px);
      display: none; place-items: center; padding: 16px; z-index: 999;
    }
    .modal-backdrop.open { display: grid; }
    .modal { width: 100%; max-width: 780px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
    .media-box { background: #050811; border-radius: 14px; padding: 14px; border: 1px solid var(--border); margin-bottom: 12px; }
    video, audio, iframe { width: 100%; border-radius: 10px; background: #000; min-height: 320px; border: 0; }
    .wave { display: flex; align-items: flex-end; gap: 4px; height: 42px; margin: 10px 0; }
    .wave span { flex: 1; background: linear-gradient(to top, var(--accent), var(--accent2)); border-radius: 4px; height: 35%; transition: height 0.2s; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .stat-box { padding: 16px; text-align: center; }
    .stat-val { font-size: 1.6rem; font-weight: 800; color: var(--accent2); margin-top: 6px; }
    .muted { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="top glass">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 64 64">
            <path fill="#3776ab" d="M31.8 6c-12.2 0-11.4 5.3-11.4 5.3l.01 5.5h11.6v1.6H15.8S6 17.5 6 29.8s8.5 11.9 8.5 11.9h5.1v-5.7s-.3-8.5 8.3-8.5h14.4s8 .1 8-7.7V13.8S51.5 6 31.8 6zm-6.6 4.7a2.1 2.1 0 1 1 0 4.2 2.1 2.1 0 0 1 0-4.2z"/>
            <path fill="#ffd43b" d="M32.2 58c12.2 0 11.4-5.3 11.4-5.3l-.01-5.5H32v-1.6h16.2S58 46.5 58 34.2s-8.5-11.9-8.5-11.9h-5.1v5.7s.3 8.5-8.3 8.5H21.7s-8-.1-8 7.7v6S12.5 58 32.2 58zm6.6-4.7a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2z"/>
          </svg>
        </div>
        <div>
          <h1>Mastering Python — خطة 30 يوماً</h1>
          <p>متابعة 152 درساً وتوزيع تمارين التكليفات (#1–#26) حسب الدرس</p>
        </div>
      </div>
      <div class="controls-row">
        <select id="planDaysSelect" title="مدة الخطة">
          <option value="30" selected>خطة 30 يوماً</option>
          <option value="45">خطة 45 يوماً</option>
          <option value="60">خطة 60 يوماً</option>
        </select>
        <input type="date" id="startDateInput" title="تاريخ البداية" />
        <button id="exportJsonBtn">تصدير JSON</button>
        <button id="importJsonBtn">استيراد JSON</button>
        <input type="file" id="importFileInput" accept="application/json" hidden />
      </div>
    </header>

    <section class="today-card glass" id="todayCard"></section>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="schedule">الجدول اليومي</button>
      <button class="tab-btn" data-tab="lessons">كل الدروس (152)</button>
      <button class="tab-btn" data-tab="assignments">التكليفات (#1–#26)</button>
      <button class="tab-btn" data-tab="stats">الإحصائيات</button>
    </nav>

    <main id="tabContent" class="glass" style="padding: 18px;"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal glass" id="modalBox"></div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "elzero_python_tracker_v2";
      const TOTAL_LESSONS = 152;
      const DEFAULT_PLAYLIST_ID = "PLDoPjvoNmBAyE_x9F6vong0eCDLeTPkO9";

      const TOPICS = [
        "المقدمة وتجهيز البيئة", "المتغيرات وأنواع البيانات", "النصوص (Strings) ودوالها",
        "الأرقام (Numbers) والعمليات", "القوائم (Lists)", "الصفوف (Tuples)",
        "المجموعات (Sets)", "القواميس (Dictionaries)", "العمليات المنطقية والمقارنة",
        "إدخال المستخدم والشروط (If / Elif / Else)", "حلقات التكرار (While & For)",
        "الدوال (Functions) و Recursion و Lambda", "التعامل مع الملفات (Files)",
        "الدوال الجاهزة (Built-in Functions)", "الوحدات والحزم (Modules & Packages)",
        "التاريخ والوقت ومعالجة الأخطاء", "التعابير النمطية (RegEx) و OOP",
        "قواعد البيانات (SQLite) والمواضيع المتقدمة"
      ];

      const ASSIGNMENTS = Array.from({ length: 26 }, (_, idx) => {
        const num = idx + 1;
        const start = Math.min(TOTAL_LESSONS, Math.max(1, Math.round((idx * TOTAL_LESSONS) / 26) + 1));
        const end = idx === 25 ? TOTAL_LESSONS : Math.max(start, Math.min(TOTAL_LESSONS, Math.round(((idx + 1) * TOTAL_LESSONS) / 26)));
        const span = Math.max(1, end - start + 1);
        const exCount = Math.min(span, 4);
        const exercises = Array.from({ length: exCount }, (__, eIdx) => {
          const targetLesson = Math.min(end, start + Math.floor((eIdx * span) / exCount));
          return {
            id: `a${num}_e${eIdx + 1}`,
            code: `#${num} • تمرين ${eIdx + 1}`,
            lessonId: targetLesson,
            title: `تطبيق عملي على الدرس #${String(targetLesson).padStart(3, "0")} (تكليف #${num})`,
            desc: `نفّذ المطلوب برمجياً على مفاهيم الدرس #${targetLesson} وتأكد من صحة المخرجات.`
          };
        });
        return {
          num,
          start,
          end,
          title: `تكليفات بايثون رقم #${num} (الدروس ${String(start).padStart(3, "0")}–${String(end).padStart(3, "0")})`,
          url: "https://elzero.org/category/assignments/python-assignments/",
          exercises
        };
      });

      const LESSONS = Array.from({ length: TOTAL_LESSONS }, (_, i) => {
        const id = i + 1;
        const topic = TOPICS[Math.min(TOPICS.length - 1, Math.floor((i / TOTAL_LESSONS) * TOPICS.length))];
        return {
          id,
          code: `#${String(id).padStart(3, "0")}`,
          title: `الدرس ${id}: ${topic}`,
          topic,
          duration: `${6 + (id % 9)}:${String((id * 7) % 60).padStart(2, "0")}`
        };
      });

      const DEFAULT_STATE = {
        planDays: 30,
        startDate: new Date().toISOString().slice(0, 10),
        activeTab: "schedule",
        selectedDay: 1,
        searchQuery: "",
        completedLessons: [],
        completedExercises: [],
        lessonVideos: {}
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { ...DEFAULT_STATE };
          const parsed = JSON.parse(raw);
          return {
            ...DEFAULT_STATE,
            ...parsed,
            completedLessons: Array.isArray(parsed.completedLessons) ? parsed.completedLessons : [],
            completedExercises: Array.isArray(parsed.completedExercises) ? parsed.completedExercises : [],
            lessonVideos: parsed.lessonVideos && typeof parsed.lessonVideos === "object" ? parsed.lessonVideos : {}
          };
        } catch (err) {
          console.warn("Storage fallback:", err);
          return { ...DEFAULT_STATE };
        }
      }

      let state = loadState();
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn("Save failed:", err);
        }
      }

      function getDayChunks() {
        const days = Number(state.planDays) || 30;
        const chunks = [];
        for (let d = 1; d <= days; d++) {
          const from = Math.floor(((d - 1) * TOTAL_LESSONS) / days) + 1;
          const to = Math.floor((d * TOTAL_LESSONS) / days);
          const ids = [];
          for (let x = from; x <= to; x++) ids.push(x);
          chunks.push({ day: d, lessonIds: ids });
        }
        return chunks;
      }

      function getCurrentDayNumber() {
        const days = Number(state.planDays) || 30;
        const start = new Date(state.startDate + "T00:00:00");
        const now = new Date();
        if (Number.isNaN(start.getTime())) return 1;
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1;
        return Math.min(days, Math.max(1, diff));
      }

      function getExercisesForLesson(lessonId) {
        const list = [];
        for (const a of ASSIGNMENTS) {
          for (const ex of a.exercises) {
            if (ex.lessonId === lessonId) {
              list.push({ ...ex, assignmentNum: a.num, assignmentUrl: a.url, assignmentTitle: a.title });
            }
          }
        }
        return list;
      }

      function toggleLessonComplete(id) {
        const idx = state.completedLessons.indexOf(id);
        if (idx >= 0) state.completedLessons.splice(idx, 1);
        else state.completedLessons.push(id);
        saveState();
        renderAll();
      }

      function toggleExerciseComplete(exId) {
        const idx = state.completedExercises.indexOf(exId);
        if (idx >= 0) state.completedExercises.splice(idx, 1);
        else state.completedExercises.push(exId);
        saveState();
        renderAll();
      }

      function extractYouTubeId(url) {
        if (!url) return "";
        const m = url.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
        return m ? m[1] : "";
      }

      function getLessonPlayerSrc(lessonId) {
        const customUrl = (state.lessonVideos[lessonId] || "").trim();
        const ytId = extractYouTubeId(customUrl);
        if (ytId) {
          return {
            type: "iframe",
            src: `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`,
            watchUrl: customUrl
          };
        }
        return {
          type: "iframe",
          src: `https://www.youtube.com/embed/videoseries?list=${DEFAULT_PLAYLIST_ID}&index=${Math.max(0, lessonId - 1)}&autoplay=1&rel=0`,
          watchUrl: `https://www.youtube.com/playlist?list=${DEFAULT_PLAYLIST_ID}`
        };
      }

      function openMediaModal(lessonId) {
        const lesson = LESSONS.find(l => l.id === lessonId);
        if (!lesson) return;
        const savedUrl = state.lessonVideos[lessonId] || "";
        const playerInfo = getLessonPlayerSrc(lessonId);

        const backdrop = document.getElementById("modalBackdrop");
        const box = document.getElementById("modalBox");
        box.innerHTML = `
          <div class="modal-head">
            <div>
              <strong>${lesson.code} — ${lesson.title}</strong>
              <div class="muted">المدة التقديرية: ${lesson.duration} • تشغيل مباشر داخل الموقع</div>
            </div>
            <button id="closeModalBtn">إغلاق ✕</button>
          </div>

          <div class="media-box">
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
              <button class="primary" id="modeVideoBtn">مشاهدة داخل الموقع</button>
              <button id="modeAudioBtn">وضع الصوت (Audio)</button>
              <a href="${playerInfo.watchUrl}" target="_blank" rel="noopener" style="text-decoration:none;">
                <button class="warn" type="button">فتح في يوتيوب ↗</button>
              </a>
            </div>

            <div id="playerStage">
              <iframe src="${playerInfo.src}" title="${lesson.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="wave" id="waveBars">
              ${Array.from({ length: 18 }, (_, k) => `<span style="height:${25 + ((k * 17) % 70)}%"></span>`).join("")}
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;">
              <label class="muted">السرعة:</label>
              <select id="speedSelect">
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
              </select>
              <label style="cursor:pointer;" class="muted">
                <span style="text-decoration:underline;">أو تشغيل ملف MP4 / MP3 من جهازك</span>
                <input type="file" id="localFileInput" accept="video/*,audio/*" hidden />
              </label>
            </div>
          </div>

          <div class="glass" style="padding:12px;margin-bottom:12px;">
            <label class="muted" style="display:block;margin-bottom:6px;">تخصيص رابط فيديو مباشر لهذا الدرس (اختياري):</label>
            <div style="display:flex;gap:8px;">
              <input type="text" id="customVideoUrlInput" value="${savedUrl.replace(/"/g, "&quot;")}" placeholder="https://www.youtube.com/watch?v=..." style="flex:1;" />
              <button class="primary" id="saveVideoUrlBtn">حفظ</button>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
            <button class="success" id="modalToggleDoneBtn">
              ${state.completedLessons.includes(lesson.id) ? "✓ مكتمل (إلغاء التحديد)" : "تحديد الدرس كمكتمل"}
            </button>
            <div style="display:flex;gap:8px;">
              <button id="prevLessonBtn" ${lesson.id <= 1 ? "disabled" : ""}>السابق</button>
              <button id="nextLessonBtn" ${lesson.id >= TOTAL_LESSONS ? "disabled" : ""}>التالي</button>
            </div>
          </div>
        `;

        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");

        document.getElementById("closeModalBtn").onclick = closeModal;
        backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };

        document.getElementById("saveVideoUrlBtn").onclick = () => {
          const val = document.getElementById("customVideoUrlInput").value.trim();
          if (val) state.lessonVideos[lesson.id] = val;
          else delete state.lessonVideos[lesson.id];
          saveState();
          openMediaModal(lesson.id);
        };

        document.getElementById("modalToggleDoneBtn").onclick = () => {
          toggleLessonComplete(lesson.id);
          openMediaModal(lesson.id);
        };

        document.getElementById("prevLessonBtn").onclick = () => openMediaModal(lesson.id - 1);
        document.getElementById("nextLessonBtn").onclick = () => openMediaModal(lesson.id + 1);

        const speedSel = document.getElementById("speedSelect");
        speedSel.onchange = () => {
          const mediaEl = document.querySelector("#playerStage video, #playerStage audio");
          if (mediaEl) mediaEl.playbackRate = parseFloat(speedSel.value) || 1;
        };

        document.getElementById("localFileInput").onchange = (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const blobUrl = URL.createObjectURL(file);
          const isAudio = file.type.startsWith("audio/");
          document.getElementById("playerStage").innerHTML = isAudio
            ? `<audio id="localAudioEl" src="${blobUrl}" controls autoplay></audio>`
            : `<video id="localVideoEl" src="${blobUrl}" controls autoplay></video>`;
          const el = document.querySelector("#playerStage video, #playerStage audio");
          if (el) el.playbackRate = parseFloat(speedSel.value) || 1;
        };

        document.getElementById("modeAudioBtn").onclick = () => {
          document.querySelectorAll("#waveBars span").forEach((bar, i) => {
            bar.style.height = `${20 + ((i * 23 + Date.now()) % 75)}%`;
          });
          const stage = document.getElementById("playerStage");
          if (!stage.querySelector("audio")) {
            stage.innerHTML = `<div class="muted" style="padding:20px;text-align:center;">وضع الصوت نشط — يمكنك رفع ملف MP3/MP4 من جهازك أو العودة لوضع المشاهدة.</div>`;
          }
        };

        document.getElementById("modeVideoBtn").onclick = () => openMediaModal(lesson.id);
      }

      function closeModal() {
        const backdrop = document.getElementById("modalBackdrop");
        backdrop.classList.remove("open");
        backdrop.setAttribute("aria-hidden", "true");
        document.getElementById("modalBox").innerHTML = "";
      }

      function openAssignmentPreview(assignNum) {
        const a = ASSIGNMENTS.find(x => x.num === assignNum);
        if (!a) return;
        const backdrop = document.getElementById("modalBackdrop");
        const box = document.getElementById("modalBox");
        box.innerHTML = `
          <div class="modal-head">
            <div>
              <strong>${a.title}</strong>
              <div class="muted">نطاق الدروس: #${String(a.start).padStart(3, "0")} إلى #${String(a.end).padStart(3, "0")}</div>
            </div>
            <button id="closeModalBtn">إغلاق ✕</button>
          </div>
          <div class="grid" style="margin-bottom:14px;">
            ${a.exercises.map(ex => {
              const done = state.completedExercises.includes(ex.id);
              return `
                <div class="sub-ex-item">
                  <div>
                    <span class="sub-tag">${ex.code}</span>
                    <strong>${ex.title}</strong>
                    <div class="muted">${ex.desc}</div>
                  </div>
                  <button class="${done ? "success" : ""}" data-ex-toggle="${ex.id}">${done ? "✓ محلول" : "تحديد كمحلول"}</button>
                </div>
              `;
            }).join("")}
          </div>
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
            <a href="${a.url}" target="_blank" rel="noopener" style="text-decoration:none;">
              <button class="primary" type="button">فتح صفحة التكليفات ↗</button>
            </a>
            <button id="closeModalBtn2">تم</button>
          </div>
        `;
        backdrop.classList.add("open");
        document.getElementById("closeModalBtn").onclick = closeModal;
        document.getElementById("closeModalBtn2").onclick = closeModal;
        backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };
        box.querySelectorAll("[data-ex-toggle]").forEach(btn => {
          btn.onclick = () => {
            toggleExerciseComplete(btn.getAttribute("data-ex-toggle"));
            openAssignmentPreview(assignNum);
          };
        });
      }

      function renderLessonItem(lesson) {
        const isDone = state.completedLessons.includes(lesson.id);
        const exercises = getExercisesForLesson(lesson.id);
        return `
          <div class="lesson-card">
            <div class="lesson-main">
              <div class="lesson-left">
                <input type="checkbox" ${isDone ? "checked" : ""} data-lesson-check="${lesson.id}" aria-label="إتمام ${lesson.title}" />
                <span class="badge-num">${lesson.code}</span>
                <div>
                  <div style="${isDone ? "text-decoration:line-through;opacity:0.7;" : "font-weight:600;"}">${lesson.title}</div>
                  <div class="muted">${lesson.topic} • ${lesson.duration}</div>
                </div>
              </div>
              <div class="lesson-actions">
                <button class="primary" data-play-lesson="${lesson.id}">مشاهدة</button>
                <button class="${isDone ? "success" : ""}" data-lesson-check="${lesson.id}">${isDone ? "مكتمل" : "إتمام"}</button>
              </div>
            </div>

            ${exercises.length ? `
              <div class="sub-ex-list">
                ${exercises.map(ex => {
                  const exDone = state.completedExercises.includes(ex.id);
                  return `
                    <div class="sub-ex-item">
                      <div>
                        <input type="checkbox" ${exDone ? "checked" : ""} data-ex-check="${ex.id}" />
                        <span class="sub-tag">${ex.code}</span>
                        <span style="${exDone ? "text-decoration:line-through;opacity:0.75;" : ""}">${ex.title}</span>
                      </div>
                      <div style="display:flex;gap:6px;">
                        <button data-preview-assign="${ex.assignmentNum}">معاينة</button>
                        <a href="${ex.assignmentUrl}" target="_blank" rel="noopener" style="text-decoration:none;">
                          <button type="button">الرابط ↗</button>
                        </a>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            ` : ""}
          </div>
        `;
      }

      function renderTodayCard() {
        const chunks = getDayChunks();
        const todayNum = getCurrentDayNumber();
        const todayChunk = chunks.find(c => c.day === todayNum) || chunks[0];
        const doneCount = state.completedLessons.length;
        const pct = Math.round((doneCount / TOTAL_LESSONS) * 100);

        document.getElementById("todayCard").innerHTML = `
          <div class="today-head">
            <div>
              <h2>مهام اليوم — اليوم ${todayNum} من ${state.planDays}</h2>
              <div class="muted">دروس اليوم: ${todayChunk.lessonIds.map(id => "#" + String(id).padStart(3, "0")).join(" ، ")}</div>
            </div>
            <button class="success" id="completeTodayBtn">إتمام مهام اليوم ✓</button>
          </div>
          <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
          <div class="muted">الإنجاز الكلي: ${doneCount} من ${TOTAL_LESSONS} درس (${pct}%) • التمارين المحلولة: ${state.completedExercises.length}</div>
        `;

        document.getElementById("completeTodayBtn").onclick = () => {
          todayChunk.lessonIds.forEach(id => {
            if (!state.completedLessons.includes(id)) state.completedLessons.push(id);
          });
          saveState();
          renderAll();
        };
      }

      function renderTabContent() {
        const container = document.getElementById("tabContent");
        if (state.activeTab === "schedule") {
          const chunks = getDayChunks();
          const activeChunk = chunks.find(c => c.day === state.selectedDay) || chunks[0];
          container.innerHTML = `
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
              ${chunks.map(c => `
                <button class="${c.day === activeChunk.day ? "primary" : ""}" data-select-day="${c.day}" style="padding:6px 10px;">
                  يوم ${c.day}
                </button>
              `).join("")}
            </div>
            <h3 style="margin-bottom:10px;">دروس اليوم ${activeChunk.day}</h3>
            <div class="grid">
              ${activeChunk.lessonIds.map(id => renderLessonItem(LESSONS[id - 1])).join("")}
            </div>
          `;
          container.querySelectorAll("[data-select-day]").forEach(btn => {
            btn.onclick = () => {
              state.selectedDay = Number(btn.getAttribute("data-select-day"));
              saveState();
              renderTabContent();
            };
          });
        } else if (state.activeTab === "lessons") {
          const q = (state.searchQuery || "").trim().toLowerCase();
          const filtered = LESSONS.filter(l => !q || l.title.toLowerCase().includes(q) || l.code.includes(q) || l.topic.toLowerCase().includes(q));
          container.innerHTML = `
            <div style="margin-bottom:14px;">
              <input type="text" id="lessonSearchInput" value="${state.searchQuery.replace(/"/g, "&quot;")}" placeholder="ابحث برقم الدرس أو العنوان أو الموضوع..." style="width:100%;max-width:420px;" />
            </div>
            <div class="grid">
              ${filtered.map(renderLessonItem).join("") || `<div class="muted">لا توجد نتائج مطابقة.</div>`}
            </div>
          `;
          document.getElementById("lessonSearchInput").oninput = (e) => {
            state.searchQuery = e.target.value;
            saveState();
            renderTabContent();
          };
        } else if (state.activeTab === "assignments") {
          container.innerHTML = `
            <div class="grid">
              ${ASSIGNMENTS.map(a => {
                const doneEx = a.exercises.filter(e => state.completedExercises.includes(e.id)).length;
                return `
                  <div class="lesson-card">
                    <div class="lesson-main">
                      <div>
                        <strong>${a.title}</strong>
                        <div class="muted">التمارين الموزعة: ${doneEx} / ${a.exercises.length}</div>
                      </div>
                      <div style="display:flex;gap:8px;">
                        <button data-preview-assign="${a.num}">معاينة التمارين</button>
                        <a href="${a.url}" target="_blank" rel="noopener" style="text-decoration:none;">
                          <button class="primary" type="button">فتح التكليف ↗</button>
                        </a>
                      </div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        } else {
          const totalEx = ASSIGNMENTS.reduce((acc, a) => acc + a.exercises.length, 0);
          container.innerHTML = `
            <div class="stats-grid">
              <div class="glass stat-box"><div class="muted">الدروس المكتملة</div><div class="stat-val">${state.completedLessons.length} / ${TOTAL_LESSONS}</div></div>
              <div class="glass stat-box"><div class="muted">التمارين المحلولة</div><div class="stat-val">${state.completedExercises.length} / ${totalEx}</div></div>
              <div class="glass stat-box"><div class="muted">روابط الفيديو المخصصة</div><div class="stat-val">${Object.keys(state.lessonVideos).length}</div></div>
              <div class="glass stat-box"><div class="muted">مدة الخطة الحالية</div><div class="stat-val">${state.planDays} يوم</div></div>
            </div>
          `;
        }

        container.querySelectorAll("[data-lesson-check]").forEach(el => {
          el.onclick = () => toggleLessonComplete(Number(el.getAttribute("data-lesson-check")));
        });
        container.querySelectorAll("[data-play-lesson]").forEach(el => {
          el.onclick = () => openMediaModal(Number(el.getAttribute("data-play-lesson")));
        });
        container.querySelectorAll("[data-ex-check]").forEach(el => {
          el.onclick = () => toggleExerciseComplete(el.getAttribute("data-ex-check"));
        });
        container.querySelectorAll("[data-preview-assign]").forEach(el => {
          el.onclick = () => openAssignmentPreview(Number(el.getAttribute("data-preview-assign")));
        });
      }

      function renderAll() {
        document.querySelectorAll(".tab-btn").forEach(btn => {
          btn.classList.toggle("active", btn.getAttribute("data-tab") === state.activeTab);
        });
        document.getElementById("planDaysSelect").value = String(state.planDays);
        document.getElementById("startDateInput").value = state.startDate;
        renderTodayCard();
        renderTabContent();
      }

      document.addEventListener("DOMContentLoaded", () => {
        try {
          document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
              state.activeTab = btn.getAttribute("data-tab");
              saveState();
              renderAll();
            };
          });

          document.getElementById("planDaysSelect").onchange = (e) => {
            state.planDays = Number(e.target.value) || 30;
            state.selectedDay = 1;
            saveState();
            renderAll();
          };

          document.getElementById("startDateInput").onchange = (e) => {
            if (e.target.value) {
              state.startDate = e.target.value;
              saveState();
              renderAll();
            }
          };

          document.getElementById("exportJsonBtn").onclick = () => {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "python-tracker-backup.json";
            a.click();
          };

          const fileInput = document.getElementById("importFileInput");
          document.getElementById("importJsonBtn").onclick = () => fileInput.click();
          fileInput.onchange = (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const imported = JSON.parse(String(reader.result || "{}"));
                state = { ...DEFAULT_STATE, ...imported };
                saveState();
                renderAll();
              } catch {
                alert("ملف JSON غير صالح");
              }
            };
            reader.readAsText(f);
          };

          renderAll();
        } catch (err) {
          console.error("Init error:", err);
        }
      });
    })();
  </script>
</body>
</html>
